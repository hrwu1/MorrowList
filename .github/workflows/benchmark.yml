name: Benchmark

# The spec 29.2 budgets at the spec 29.1 reference scale (GAP-23).
#
# Nightly rather than per pull request: a run seeds 100,000 tasks and drives fourteen
# scenarios, which takes minutes, and latency numbers are only comparable between runs on
# the same hardware. So the job compares against its own previous result, restored from
# the actions cache, and never against the table in docs/performance.md — that table was
# measured on a developer machine and would fail every runner.
#
# The absolute budget check needs no baseline: bench.mjs exits non-zero on its own when a
# p95 exceeds what spec 29.2 allows.

on:
  schedule:
    # 03:20 UTC, off the hour so it does not queue behind everyone else's nightly.
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      scale:
        description: "Seed scale"
        type: choice
        options: [reference, small]
        default: reference

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  benchmark:
    name: Reference-scale benchmark
    # Use one native reference architecture; the generic x86 pool rotates CPU models.
    # This is the same standard ARM64 runner used by the published image smoke test.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morrowlist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The benchmark never touches this one; it is here so the typed environment parses.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morrowlist
      BENCH_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morrowlist_bench
      AUTH_SECRET: ci-only-secret-value-not-used-in-production
      BENCH_PORT: "3400"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create the throwaway benchmark database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE morrowlist_bench'

      # Hosted ubuntu runners use different CPUs. Compare only matching hardware,
      # runtimes and datasets; a cache miss still enforces every absolute budget.
      - name: Identify comparable benchmark environment
        id: environment
        env:
          BENCH_SCALE: ${{ inputs.scale || 'reference' }}
          BENCH_WORKLOAD: ${{ hashFiles('scripts/bench.mjs', 'scripts/seed-scale.mjs', '.github/workflows/benchmark.yml') }}
        run: |
          node --input-type=module <<'NODE'
          import { cpus, platform, arch } from 'node:os';
          import { createHash } from 'node:crypto';
          import { appendFileSync } from 'node:fs';
          const environment = {
            cpu: cpus()[0]?.model, cores: cpus().length,
            platform: platform(), arch: arch(), node: process.version,
            scale: process.env.BENCH_SCALE, workload: process.env.BENCH_WORKLOAD,
          };
          if (!environment.cpu) throw new Error('Cannot identify benchmark CPU');
          const key = createHash('sha256').update(JSON.stringify(environment)).digest('hex');
          appendFileSync(process.env.GITHUB_OUTPUT, `cache-prefix=benchmark-v2-${key}\n`);
          console.log('Benchmark environment:', environment);
          NODE

      - id: baseline
        uses: actions/cache/restore@v4
        with:
          path: previous.json
          key: ${{ steps.environment.outputs.cache-prefix }}-${{ github.run_id }}
          restore-keys: ${{ steps.environment.outputs.cache-prefix }}-

      - name: Run the benchmark
        run: |
          node scripts/bench.mjs \
            --scale "${{ inputs.scale || 'reference' }}" \
            --out benchmark.json \
            ${{ steps.baseline.outputs.cache-matched-key && '--check previous.json --regression 20' || '' }}

      - name: Keep this run as the next run's baseline
        if: success()
        run: cp benchmark.json previous.json

      - uses: actions/cache/save@v4
        if: success()
        with:
          path: previous.json
          key: ${{ steps.environment.outputs.cache-prefix }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmark.json
          retention-days: 90
