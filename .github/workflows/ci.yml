name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # Fast feedback: everything that needs no database runs first and in one job, so a
  # formatting slip does not wait behind a PostgreSQL container.
  static:
    name: Lint, types, and contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - name: Lint and prove the architecture boundaries still fire
        run: pnpm lint
      - run: pnpm typecheck
      - name: Fail if the committed OpenAPI document has drifted
        run: pnpm openapi:check

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Must match the production target so collation and constraint behaviour are
        # exercised as deployed (spec 15.1).
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morrowlist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morrowlist
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morrowlist_test
      AUTH_SECRET: ci-only-secret-value-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create the test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE morrowlist_test'
      - name: Apply migrations from an empty database
        run: pnpm db:migrate
      - run: pnpm test:integration
      # The reference-scale seed writes through the repositories and the domain policies,
      # so a schema or policy change can break it. Proving it still runs costs seconds at
      # the reduced scale; the nightly benchmark runs it at the full 100,000 rows.
      - name: Seed a throwaway database at reduced scale
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE morrowlist_seed'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/morrowlist_seed pnpm db:migrate
          node scripts/seed-scale.mjs \
            --database-url postgresql://postgres:postgres@localhost:5432/morrowlist_seed \
            --scale small

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: morrowlist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morrowlist
      # The suite signs up real accounts, so it gets its own database and migrates and
      # truncates it in Playwright's global setup.
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/morrowlist_e2e
      AUTH_SECRET: ci-only-secret-value-not-used-in-production
      APP_URL: http://127.0.0.1:3250
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create the end-to-end database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE morrowlist_e2e'
      - run: pnpm --filter @morrowlist/web test:e2e:install
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
