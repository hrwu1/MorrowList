# One-command self-hosted MorrowList (GAP-23, spec 31.2).
#
#   cp infra/compose/.env.prod.example infra/compose/.env
#   $EDITOR infra/compose/.env          # set AUTH_SECRET and POSTGRES_PASSWORD
#   docker compose -f infra/compose/docker-compose.prod.yml up -d
#
# Two containers: PostgreSQL and the application. The reminder worker runs inside the
# application process (WORKER_MODE=embedded), so nothing else is needed for a small box.
# See docs/runbooks/self-hosting.md.
name: morrowlist

services:
  postgres:
    # Must match the version the schema is developed and tested against (spec 15.1).
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-morrowlist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:-morrowlist}
    volumes:
      - morrowlist-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-morrowlist} -d ${POSTGRES_DB:-morrowlist}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published: only the application container needs to reach the database.
    expose:
      - "5432"

  app:
    # Published from CI for linux/amd64 and linux/arm64; `docker compose build app`
    # builds it locally instead.
    image: ${MORROWLIST_IMAGE:-ghcr.io/morrowlist/morrowlist:latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Must be the URL the browser uses; auth rejects a sign-in posted from any other
      # origin, so a reverse proxy in front of this needs its own URL here.
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Set this to the same origin as APP_URL (comma-separated if there are several).
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?generate one with `openssl rand -base64 32`}
      DATABASE_URL: postgresql://${POSTGRES_USER:-morrowlist}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-morrowlist}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # One container is enough: the reminder loop runs inside the web process.
      WORKER_MODE: ${WORKER_MODE:-embedded}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-30}
      INBOUND_EMAIL_DOMAIN: ${INBOUND_EMAIL_DOMAIN:-}
      INBOUND_EMAIL_SECRET: ${INBOUND_EMAIL_SECRET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-morrowlist@localhost}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-90}
      # A single replica migrates on start. Running more than one web container means
      # setting this to false and running the `migrate` role once per release instead
      # (spec 31.2); see the runbook.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "${MORROWLIST_PORT:-3000}:3000"

volumes:
  morrowlist-pgdata:
